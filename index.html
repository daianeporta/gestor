<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Tráfego</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f; --surface: #181818; --surface2: #222222;
  --border: #2a2a2a; --border2: #333333;
  --text: #f0f0f0; --text2: #888888; --text3: #555555;
  --accent: #c8f264; --accent-dim: #9ab84a; --accent-bg: rgba(200,242,100,0.08);
  --danger: #ff5a5a; --danger-bg: rgba(255,90,90,0.08);
  --warning: #f5a623; --warning-bg: rgba(245,166,35,0.08);
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.login-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 380px; padding: 2rem; }
.login-logo { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
.login-title { font-size: 22px; font-weight: 600; margin-bottom: 2rem; }
.login-msg { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.6; }
.login-error { font-size: 13px; color: var(--danger); background: var(--danger-bg); border: 1px solid rgba(255,90,90,0.2); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 1rem; }

/* APP */
.app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); gap: 1rem; flex-wrap: wrap; }
.top-left { display: flex; align-items: center; gap: 16px; }
.logo-area { }
.logo { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
.page-title { font-size: 22px; font-weight: 600; color: var(--text); }
.top-right { display: flex; align-items: center; gap: 10px; }
.user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px 6px 8px; font-size: 12px; color: var(--text2); }
.user-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-bg); border: 1px solid rgba(200,242,100,0.2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; }

/* AGENCY SELECTOR */
.agency-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.agency-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; white-space: nowrap; }
.agency-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.agency-pill { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--text3); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
.agency-pill:hover { color: var(--text2); border-color: var(--text3); }
.agency-pill.active { background: var(--accent-bg); color: var(--accent); border-color: rgba(200,242,100,0.3); }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn-accent { background: var(--accent); color: #111; }
.btn-accent:hover { background: #d8ff74; transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { border-color: var(--text3); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.btn-danger-ghost { background: transparent; color: var(--danger); border: 1px solid rgba(255,90,90,0.25); }
.btn-danger-ghost:hover { background: var(--danger-bg); }
.btn-sm { padding: 7px 13px; font-size: 12px; }
.btn-logout { background: transparent; border: 1px solid var(--border2); color: var(--text3); padding: 7px 12px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
.btn-logout:hover { color: var(--danger); border-color: rgba(255,90,90,0.3); }

/* STATS */
.stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; flex: 1; }
.stat-val { font-size: 22px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* MAIN TABS */
.main-tabs { display: flex; gap: 2px; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.main-tab { padding: 10px 18px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
.main-tab:hover { color: var(--text2); }
.main-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* PLATFORM TABS */
.platform-tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px; }
.platform-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text3); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
.platform-tab:hover { color: var(--text2); }
.platform-tab.active { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.tab-icon { width: 18px; height: 18px; flex-shrink: 0; }
.tab-count { font-size: 11px; font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text3); padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
.platform-tab.active .tab-count { color: var(--accent); border-color: rgba(200,242,100,0.2); }

/* SEARCH */
.search-wrap { position: relative; margin-bottom: 1.25rem; }
.search-input { width: 100%; padding: 10px 14px 10px 40px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; transition: border-color 0.15s; }
.search-input:focus { outline: none; border-color: var(--border2); }
.search-input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }

/* EMPTY */
.empty { text-align: center; padding: 4rem 2rem; color: var(--text3); font-size: 14px; line-height: 2; }
.empty-icon { font-size: 32px; margin-bottom: 1rem; opacity: 0.3; }

/* CLIENT CARD */
.client-list { display: flex; flex-direction: column; gap: 10px; }
.client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
.client-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
.client-card.reminder::before { background: var(--warning); opacity: 1; }
.client-card:hover { border-color: var(--border2); background: var(--surface2); }
.client-card:hover::before { opacity: 1; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-bg); border: 1px solid rgba(200,242,100,0.2); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: var(--accent); flex-shrink: 0; font-family: 'DM Mono', monospace; }
.client-card.reminder .avatar { background: var(--warning-bg); border-color: rgba(245,166,35,0.2); color: var(--warning); }
.client-info { flex: 1; min-width: 0; }
.client-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.badge-niche { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
.badge-type { background: var(--accent-bg); color: var(--accent-dim); border: 1px solid rgba(200,242,100,0.15); }
.badge-google { background: rgba(66,133,244,0.1); color: #4285f4; border: 1px solid rgba(66,133,244,0.2); }
.badge-meta { background: rgba(24,119,242,0.08); color: #1877f2; border: 1px solid rgba(24,119,242,0.15); }
.badge-warn { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245,166,35,0.2); font-size: 10px; }
.card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.opt-count { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text3); padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; opacity: 0; }
.client-card:hover .icon-btn { opacity: 1; }
.icon-btn:hover { color: var(--text); background: var(--surface2); }
.icon-btn.danger:hover { color: var(--danger); background: var(--danger-bg); }
.arrow { color: var(--text3); font-size: 18px; transition: transform 0.15s; }
.client-card:hover .arrow { transform: translateX(3px); color: var(--accent); }

/* OVERLAY & MODAL */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.2s ease; }
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-title { font-size: 15px; font-weight: 500; color: var(--text); }
.close-btn { background: none; border: none; color: var(--text3); font-size: 22px; cursor: pointer; line-height: 1; transition: color 0.15s; padding: 2px 6px; border-radius: 4px; }
.close-btn:hover { color: var(--text); background: var(--surface2); }
.modal-body { padding: 1.5rem; }

/* FORM */
.form-group { margin-bottom: 1.25rem; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; transition: border-color 0.15s; appearance: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,242,100,0.08); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
.form-select { cursor: pointer; }
.form-select option { background: var(--surface2); }
.form-textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 0.5rem; }
.form-row { display: flex; gap: 1rem; }
.form-row .form-group { flex: 1; }

/* PLATFORM CHECKS */
.platform-checks { display: flex; gap: 12px; flex-wrap: wrap; }
.platform-check { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2); cursor: pointer; transition: all 0.15s; user-select: none; }
.platform-check input { display: none; }
.check-box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.platform-check input:checked ~ .check-box { background: var(--accent); border-color: var(--accent); }
.platform-check input:checked ~ .check-box::after { content: '✓'; font-size: 11px; color: #111; font-weight: 700; }
.platform-check:has(input:checked) { border-color: rgba(200,242,100,0.3); background: var(--accent-bg); }
.check-label { font-size: 13px; color: var(--text2); }
.platform-check:has(input:checked) .check-label { color: var(--text); }

/* DETAIL */
.detail-modal { max-width: 600px; }
.detail-head { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.detail-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-bg); border: 1px solid rgba(200,242,100,0.2); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: var(--accent); flex-shrink: 0; font-family: 'DM Mono', monospace; }
.detail-meta { flex: 1; min-width: 0; }
.detail-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.opt-section { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
.section-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.opt-list-section { padding: 1.25rem 1.5rem; }
.opt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.opt-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--text3); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.filter-btn:hover { color: var(--text2); border-color: var(--text3); }
.filter-btn.active { background: var(--accent-bg); color: var(--accent-dim); border-color: rgba(200,242,100,0.3); }
.opt-item { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; }
.opt-item:hover { border-color: var(--border2); }
.opt-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
.opt-date { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.opt-author { font-size: 11px; color: var(--accent-dim); font-weight: 500; }
.opt-text { font-size: 13px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; }
.opt-actions { display: flex; gap: 8px; margin-top: 10px; }
.empty-opts { text-align: center; padding: 2rem; font-size: 13px; color: var(--text3); }
.reminder-alert { display: flex; align-items: center; gap: 10px; background: var(--warning-bg); border: 1px solid rgba(245,166,35,0.2); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--warning); line-height: 1.5; }

/* CONFIRM */
.confirm-modal { max-width: 380px; }
.confirm-body { padding: 1.5rem; }
.confirm-msg { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 1.5rem; }
.confirm-name { color: var(--text); font-weight: 500; }
.confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* WEEKLY */
.week-section { margin-bottom: 2rem; }
.week-day-title { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.week-client { margin-bottom: 16px; }
.week-client-name { font-size: 13px; font-weight: 500; color: var(--accent-dim); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.week-mini-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-bg); border: 1px solid rgba(200,242,100,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; flex-shrink: 0; }
.week-opt { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 6px; }
.week-opt-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.week-opt-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }
.week-opt-author { font-size: 10px; color: var(--accent-dim); font-weight: 500; }
.week-opt-text { font-size: 13px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }

/* LOADING */
.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; gap: 10px; color: var(--text3); font-size: 14px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">Dashboard</div>
    <div class="login-title">Gestão de tráfego</div>
    <div class="login-msg" id="login-msg">Entre com seu e-mail para acessar. Você receberá um link mágico de acesso.</div>
    <div id="login-error" class="login-error" style="display:none"></div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" id="login-email" type="email" placeholder="seu@email.com">
    </div>
    <button class="btn btn-accent" style="width:100%;justify-content:center" onclick="sendMagicLink()" id="login-btn">Enviar link de acesso</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen" style="display:none">
  <div class="app">
    <div class="top-bar">
      <div class="top-left">
        <div class="logo-area">
          <div class="logo">Dashboard</div>
          <div class="page-title">Gestão de tráfego</div>
        </div>
      </div>
      <div class="top-right">
        <div class="user-chip">
          <div class="user-dot" id="user-dot"></div>
          <span id="user-label"></span>
        </div>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- AGENCY SELECTOR -->
    <div class="agency-bar">
      <span class="agency-label">Agência:</span>
      <div class="agency-pills" id="agency-pills"></div>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="main-tabs">
      <button class="main-tab active" id="mtab-clients" onclick="setMainTab('clients')">Clientes</button>
      <button class="main-tab" id="mtab-week" onclick="setMainTab('week')">Resumo semanal</button>
    </div>

    <div id="view-clients">
      <div class="platform-tabs">
        <button class="platform-tab active" id="tab-google" onclick="setPlatformTab('google')">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google Ads <span class="tab-count" id="count-google">0</span>
        </button>
        <button class="platform-tab" id="tab-meta" onclick="setPlatformTab('meta')">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="#1877f2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Meta Ads <span class="tab-count" id="count-meta">0</span>
        </button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search-input" type="text" placeholder="Buscar por nome ou nicho..." oninput="renderList()">
      </div>
      <div id="client-list"></div>

<script>
const SUPABASE_URL = 'https://ofjhiwygerfqnexqival.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mamhpd3lnZXJmcW5leHFpdmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxODI4NTcsImV4cCI6MjA5Mjc1ODg1N30.HxGYMCeTM-3f8Xw2go_npLJzuQU5P4BRClBvN0G5YLU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let agencies = [];
let clients = [];
let optimizations = [];
let activeAgencyId = null;
let activeTab = 'google';
let activeMainTab = 'clients';
let openClientId = null;
let editingClientId = null;
let pendingDeleteId = null;

// --- AUTH ---
async function sendMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showLoginError('Digite seu e-mail.'); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Enviando...'; btn.disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: 'https://daianeporta.github.io/gestor/' } });
  btn.disabled = false;
  if (error) { btn.textContent = 'Enviar link de acesso'; showLoginError('Erro: ' + error.message); return; }
  document.getElementById('login-msg').textContent = '✓ Link enviado! Verifique seu e-mail e clique no link para entrar.';
  btn.textContent = 'Reenviar link';
  document.getElementById('login-error').style.display = 'none';
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}

async function logout() {
  await sb.auth.signOut();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  currentUser = null;
}

// --- INIT ---
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await startApp(session.user);

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session && !currentUser) await startApp(session.user);
    else if (!session) {
      currentUser = null;
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }
  });
}

async function startApp(user) {
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  const email = user.email || '';
  const initials = email.substring(0, 2).toUpperCase();
  document.getElementById('user-dot').textContent = initials;
  document.getElementById('user-label').textContent = email;
  await loadAgencies();
  await loadAll();
}

// --- DATA ---
async function loadAgencies() {
  const { data } = await sb.from('agencies').select('*').order('name');
  agencies = data || [];
  renderAgencyPills();
  if (agencies.length && !activeAgencyId) activeAgencyId = agencies[0].id;
}

async function loadAll() {
  if (!activeAgencyId) return;
  document.getElementById('client-list').innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  const { data: cData } = await sb.from('clients').select('*').eq('agency_id', activeAgencyId).order('name');
  clients = cData || [];
  const clientIds = clients.map(c => c.id);
  if (clientIds.length) {
    const { data: oData } = await sb.from('optimizations').select('*').in('client_id', clientIds).order('created_at', { ascending: true });
    optimizations = oData || [];
  } else { optimizations = []; }
  renderList();
}

function getClientOpts(clientId) {
  return optimizations.filter(o => o.client_id === clientId);
}

// --- HELPERS ---
function initials(n) { return n.trim().split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts) { const d=new Date(ts); return d.toLocaleDateString('pt-BR')+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(ts) { return Math.floor((Date.now()-new Date(ts).getTime())/86400000); }
function emailLabel(email) { return email ? email.split('@')[0] : '?'; }

function needsReminder(c) {
  if (!c.reminder_days) return false;
  const opts = getClientOpts(c.id);
  const lastTs = opts.length ? opts[opts.length-1].created_at : c.created_at;
  return daysSince(lastTs) >= c.reminder_days;
}
function lastOptDaysAgo(c) {
  const opts = getClientOpts(c.id);
  if (!opts.length) return null;
  return daysSince(opts[opts.length-1].created_at);
}

// --- RENDER ---
function renderAgencyPills() {
  const el = document.getElementById('agency-pills');
  el.innerHTML = agencies.map(a =>
    `<button class="agency-pill${a.id===activeAgencyId?' active':''}" onclick="switchAgency('${a.id}')">${esc(a.name)}</button>`
  ).join('');
}

async function switchAgency(id) {
  activeAgencyId = id;
  renderAgencyPills();
  await loadAll();
}

function renderList() {
  const googleClients = clients.filter(c=>c.platforms&&c.platforms.includes('google'));
  const metaClients = clients.filter(c=>c.platforms&&c.platforms.includes('meta'));
  const totalOpts = optimizations.length;
  const remCount = clients.filter(c=>needsReminder(c)).length;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-val">${clients.length}</div><div class="stat-label">Clientes ativos</div></div>
    <div class="stat"><div class="stat-val">${totalOpts}</div><div class="stat-label">Otimizações registradas</div></div>
    ${remCount>0?`<div class="stat"><div class="stat-val" style="color:var(--warning)">${remCount}</div><div class="stat-label">Precisam de atenção</div></div>`:''}`;

  document.getElementById('count-google').textContent = googleClients.length;
  document.getElementById('count-meta').textContent = metaClients.length;

  const query = (document.getElementById('search-input')?.value||'').toLowerCase().trim();
  let filtered = clients.filter(c=>c.platforms&&c.platforms.includes(activeTab));
  if (query) filtered = filtered.filter(c=>c.name.toLowerCase().includes(query)||(c.niche||'').toLowerCase().includes(query));
  filtered.sort((a,b)=>(needsReminder(b)?1:0)-(needsReminder(a)?1:0));

  const el = document.getElementById('client-list');
  if (!filtered.length) {
    const label = activeTab==='google'?'Google Ads':'Meta Ads';
    el.innerHTML = `<div class="empty"><div class="empty-icon">◻</div>${query?'Nenhum resultado para sua busca.':'Nenhum cliente com '+label+' cadastrado ainda.'}</div>`;
    return;
  }

  el.innerHTML = `<div class="client-list">${filtered.map(c=>{
    const opts = getClientOpts(c.id).length;
    const platBadges = (c.platforms||[]).map(p=>p==='google'?`<span class="badge badge-google">Google Ads</span>`:`<span class="badge badge-meta">Meta Ads</span>`).join('');
    const isRem = needsReminder(c);
    const daysAgo = lastOptDaysAgo(c);
    const remBadge = isRem?`<span class="badge badge-warn">⚠ ${daysAgo}d sem otimizar</span>`:'';
    return `<div class="client-card${isRem?' reminder':''}" onclick="openClient('${c.id}')">
      <div class="avatar">${initials(c.name)}</div>
      <div class="client-info">
        <div class="client-name">${esc(c.name)}</div>
        <div class="badges">
          <span class="badge badge-niche">${esc(c.niche)}</span>
          <span class="badge badge-type">${esc(c.type)}</span>
          ${platBadges}${remBadge}
        </div>
      </div>
      <div class="card-right">
        <span class="opt-count">${opts} opt${opts!==1?'s':''}</span>
        <button class="icon-btn" onclick="event.stopPropagation();openEditModal('${c.id}')" title="Editar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deleteClient('${c.id}')" title="Excluir">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
        <span class="arrow">›</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderDetail() {
  const c = clients.find(x=>x.id===openClientId);
  if (!c) return;
  document.getElementById('d-avatar').textContent = initials(c.name);
  document.getElementById('d-name').textContent = c.name;
  const platBadges = (c.platforms||[]).map(p=>p==='google'?`<span class="badge badge-google">Google Ads</span>`:`<span class="badge badge-meta">Meta Ads</span>`).join('');
  document.getElementById('d-badges').innerHTML = `<span class="badge badge-niche">${esc(c.niche)}</span><span class="badge badge-type">${esc(c.type)}</span>${platBadges}`;

  const alertEl = document.getElementById('d-reminder-alert');
  if (needsReminder(c)) {
    const d = lastOptDaysAgo(c);
    alertEl.innerHTML = `<div class="reminder-alert">⚠ Este cliente está há ${d} dia${d!==1?'s':''} sem otimização. Frequência: a cada ${c.reminder_days} dias.</div>`;
  } else { alertEl.innerHTML=''; }

  const opts = getClientOpts(c.id);
  document.getElementById('d-opt-label').textContent = `Histórico (${opts.length})`;
  document.getElementById('d-opt-filters').innerHTML = [
    {k:'all',l:'Todos'},{k:'7',l:'7 dias'},{k:'30',l:'30 dias'},{k:'90',l:'90 dias'}
  ].map(f=>`<button class="filter-btn${detailFilter===f.k?' active':''}" onclick="setDetailFilter('${f.k}')">${f.l}</button>`).join('');

  document.getElementById('opt-input').value = '';
  const now = Date.now();
  const days = detailFilter==='all'?null:parseInt(detailFilter);
  const filtered = days ? opts.filter(o=>now-new Date(o.created_at).getTime()<=days*86400000) : opts;

  const listEl = document.getElementById('d-opt-list');
  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-opts">${opts.length===0?'Nenhuma otimização registrada ainda.':'Nenhuma otimização neste período.'}</div>`;
    return;
  }

  listEl.innerHTML = [...filtered].reverse().map(o => {
    const author = emailLabel(o.user_email);
    const isMe = o.user_email === currentUser?.email;
    if (editingOptId===o.id) return `<div class="opt-item">
      <div class="opt-meta"><span class="opt-date">${fmtDate(o.created_at)}</span><span class="opt-author">${esc(author)}</span></div>
      <textarea class="form-textarea" id="edit-${o.id}" style="min-height:70px">${esc(o.text)}</textarea>
      <div class="opt-actions">
        <button class="btn btn-accent btn-sm" onclick="saveOptEdit('${o.id}')">Salvar</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelOptEdit()">Cancelar</button>
      </div></div>`;
    return `<div class="opt-item">
      <div class="opt-meta">
        <span class="opt-date">${fmtDate(o.created_at)}</span>
        <span class="opt-author">${esc(author)}</span>
      </div>
      <div class="opt-text">${esc(o.text)}</div>
      ${isMe?`<div class="opt-actions">
        <button class="btn btn-ghost btn-sm" onclick="startOptEdit('${o.id}','${esc(o.text).replace(/'/g,"\\'")}')">Editar</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="deleteOpt('${o.id}')">Excluir</button>
      </div>`:''}
    </div>`;
  }).join('');
}

function renderWeek() {
  const weekAgo = Date.now()-7*86400000;
  const el = document.getElementById('week-content');
  const entries = [];
  clients.forEach(c => {
    getClientOpts(c.id).forEach(o => {
      if (new Date(o.created_at).getTime() >= weekAgo) entries.push({client:c, opt:o});
    });
  });

  if (!entries.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">◻</div>Nenhuma otimização nos últimos 7 dias.</div>`;
    return;
  }

  const byDay = {};
  entries.forEach(e => {
    const dk = new Date(e.opt.created_at).toDateString();
    const label = new Date(e.opt.created_at).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
    if (!byDay[dk]) byDay[dk] = {label, ts:new Date(e.opt.created_at).getTime(), items:[]};
    byDay[dk].items.push(e);
  });

  const days = Object.keys(byDay).sort((a,b)=>byDay[b].ts-byDay[a].ts);
  el.innerHTML = days.map(dk => {
    const {label, items} = byDay[dk];
    const byClient = {};
    items.forEach(e => {
      if (!byClient[e.client.id]) byClient[e.client.id] = {client:e.client, opts:[]};
      byClient[e.client.id].opts.push(e.opt);
    });
    return `<div class="week-section">
      <div class="week-day-title">${label.charAt(0).toUpperCase()+label.slice(1)}</div>
      ${Object.values(byClient).map(({client,opts})=>`
        <div class="week-client">
          <div class="week-client-name"><span class="week-mini-avatar">${initials(client.name)}</span>${esc(client.name)}</div>
          ${opts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o=>`
            <div class="week-opt">
              <div class="week-opt-header">
                <span class="week-opt-date">${fmtDate(o.created_at)}</span>
                <span class="week-opt-author">${esc(emailLabel(o.user_email))}</span>
              </div>
              <div class="week-opt-text">${esc(o.text)}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>`;
  }).join('');
}

// --- CLIENT CRUD ---
function openAddModal() {
  ['f-name','f-niche'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-type').value='';
  document.getElementById('f-google').checked=false;
  document.getElementById('f-meta').checked=false;
  document.getElementById('f-reminder').value='';
  openModal('modal-add');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}

async function addClient() {
  const name = document.getElementById('f-name').value.trim();
  const niche = document.getElementById('f-niche').value.trim();
  const type = document.getElementById('f-type').value;
  const google = document.getElementById('f-google').checked;
  const meta = document.getElementById('f-meta').checked;
  const reminder = document.getElementById('f-reminder').value;
  if (!name||!niche||!type) { showAlert('Preencha todos os campos.'); return; }
  if (!google&&!meta) { showAlert('Selecione ao menos uma plataforma.'); return; }
  const platforms = []; if(google) platforms.push('google'); if(meta) platforms.push('meta');
  const { error } = await sb.from('clients').insert({
    agency_id: activeAgencyId, name, niche, type, platforms,
    reminder_days: reminder ? parseInt(reminder) : null
  });
  if (error) { showAlert('Erro ao salvar: '+error.message); return; }
  closeModal('modal-add');
  await loadAll();
}

function openEditModal(id) {
  const c = clients.find(x=>x.id===id); if(!c) return;
  editingClientId = id;
  document.getElementById('e-name').value = c.name;
  document.getElementById('e-niche').value = c.niche;
  document.getElementById('e-type').value = c.type;
  document.getElementById('e-google').checked = (c.platforms||[]).includes('google');
  document.getElementById('e-meta').checked = (c.platforms||[]).includes('meta');
  document.getElementById('e-reminder').value = c.reminder_days||'';
  openModal('modal-edit');
  setTimeout(()=>document.getElementById('e-name').focus(),50);
}

async function saveEditClient() {
  const name = document.getElementById('e-name').value.trim();
  const niche = document.getElementById('e-niche').value.trim();
  const type = document.getElementById('e-type').value;
  const google = document.getElementById('e-google').checked;
  const meta = document.getElementById('e-meta').checked;
  const reminder = document.getElementById('e-reminder').value;
  if (!name||!niche||!type) { showAlert('Preencha todos os campos.'); return; }
  if (!google&&!meta) { showAlert('Selecione ao menos uma plataforma.'); return; }
  const platforms = []; if(google) platforms.push('google'); if(meta) platforms.push('meta');
  const { error } = await sb.from('clients').update({ name, niche, type, platforms, reminder_days: reminder?parseInt(reminder):null }).eq('id', editingClientId);
  if (error) { showAlert('Erro ao salvar: '+error.message); return; }
  closeModal('modal-edit');
  await loadAll();
}

function deleteClient(id) {
  const c = clients.find(x=>x.id===id); if(!c) return;
  pendingDeleteId = id;
  document.getElementById('confirm-name').textContent = c.name;
  openModal('modal-confirm');
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  await sb.from('clients').delete().eq('id', pendingDeleteId);
  pendingDeleteId = null;
  closeModal('modal-confirm');
  await loadAll();
}

function openClient(id) {
  openClientId = id; editingOptId = null; detailFilter = 'all';
  renderDetail(); openModal('modal-detail');
  setTimeout(()=>document.getElementById('opt-input').focus(),100);
}

// --- OPT CRUD ---
async function addOpt() {
  const text = document.getElementById('opt-input').value.trim();
  if (!text) return;
  const { error } = await sb.from('optimizations').insert({
    client_id: openClientId, user_email: currentUser.email, text
  });
  if (error) { showAlert('Erro: '+error.message); return; }
  const { data } = await sb.from('optimizations').select('*').eq('client_id', openClientId).order('created_at');
  optimizations = optimizations.filter(o=>o.client_id!==openClientId).concat(data||[]);
  renderDetail(); renderList();
}

function startOptEdit(optId, text) { editingOptId=optId; renderDetail(); const el=document.getElementById('edit-'+optId); if(el){el.value=text;el.focus();} }
function cancelOptEdit() { editingOptId=null; renderDetail(); }

async function saveOptEdit(optId) {
  const el = document.getElementById('edit-'+optId); if(!el) return;
  const text = el.value.trim(); if(!text) return;
  await sb.from('optimizations').update({text}).eq('id', optId);
  const idx = optimizations.findIndex(o=>o.id===optId);
  if (idx>=0) optimizations[idx].text = text;
  editingOptId=null; renderDetail();
}

async function deleteOpt(optId) {
  await sb.from('optimizations').delete().eq('id', optId);
  optimizations = optimizations.filter(o=>o.id!==optId);
  renderDetail(); renderList();
}

function showAlert(msg) {
  const d=document.createElement('div'); d.className='overlay'; d.id='modal-alert';
  d.innerHTML=`<div class="modal confirm-modal" onclick="event.stopPropagation()">
    <div class="modal-head"><span class="modal-title">Atenção</span><button class="close-btn" onclick="document.getElementById('modal-alert').remove()">×</button></div>
    <div class="confirm-body"><div class="confirm-msg">${esc(msg)}</div>
    <div class="confirm-actions"><button class="btn btn-accent" onclick="document.getElementById('modal-alert').remove()">OK</button></div></div></div>`;
  document.body.appendChild(d);
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') ['modal-detail','modal-add','modal-edit','modal-confirm'].forEach(id=>closeModal(id));
  if ((e.ctrlKey||e.metaKey)&&e.key==='Enter') {
    if (document.getElementById('modal-detail').style.display!=='none') addOpt();
    if (document.getElementById('modal-add').style.display!=='none') addClient();
    if (document.getElementById('modal-edit').style.display!=='none') saveEditClient();
  }
});

init();
</script>
</body>
</html>
